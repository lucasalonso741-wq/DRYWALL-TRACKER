<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AA Drywall — Job Cost Command</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ AA DRYWALL / JOB COST COMMAND — industrial field-ops theme ============ */
:root{
  --bg:#101114; --panel:#17191d; --panel2:#1d2026; --line:#26292f; --line2:#33373f;
  --txt:#e8e6e1; --dim:#9a978f; --faint:#6b6963;
  --accent:#ffb020; --accent-dim:#8a5f10;
  --ordered:#c77f0a; --billed:#4a90e2; --paid:#2fa666;
  --red:#e25d55; --green:#2fa666; --blue:#4a90e2;
  --mono:'Barlow Condensed',sans-serif; --body:'Inter',system-ui,sans-serif;
  --rad:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--body);font-size:14px;line-height:1.45;
  background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
  background-size:32px 32px;}
a{color:var(--accent);text-decoration:none}
button{font-family:var(--body)}
::selection{background:var(--accent-dim);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}::-webkit-scrollbar-track{background:transparent}

/* ---- login ---- */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:100;
  background-image:linear-gradient(rgba(255,176,32,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,176,32,.03) 1px,transparent 1px);background-size:32px 32px}
.login-box{text-align:center;max-width:360px;width:90%}
.wordmark{font-family:var(--mono);font-weight:700;font-size:44px;letter-spacing:.06em;line-height:.95;text-transform:uppercase}
.wordmark b{color:var(--accent)}
.login-sub{font-family:var(--mono);color:var(--dim);letter-spacing:.35em;text-transform:uppercase;font-size:13px;margin:6px 0 34px}
.login-box input{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:var(--rad);color:var(--txt);
  font-size:20px;letter-spacing:.4em;text-align:center;padding:14px;text-transform:uppercase;font-family:var(--mono)}
.login-box input:focus{outline:none;border-color:var(--accent)}
.login-err{color:var(--red);height:20px;margin-top:10px;font-size:13px}

/* ---- shell ---- */
#shell{display:flex;min-height:100vh}
#rail{width:212px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.rail-brand{padding:18px 16px 14px;border-bottom:1px solid var(--line)}
.rail-brand .wm{font-family:var(--mono);font-weight:700;font-size:21px;letter-spacing:.05em;text-transform:uppercase;line-height:1}
.rail-brand .wm b{color:var(--accent)}
.rail-brand .sub{font-size:10px;color:var(--faint);letter-spacing:.28em;text-transform:uppercase;margin-top:4px}
.rail-nav{padding:10px 8px;flex:1;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;color:var(--dim);cursor:pointer;
  font-weight:500;font-size:13.5px;margin-bottom:2px;border-left:3px solid transparent;user-select:none}
.nav-item:hover{background:var(--panel2);color:var(--txt)}
.nav-item.on{background:var(--panel2);color:var(--txt);border-left-color:var(--accent)}
.nav-item .ic{width:17px;text-align:center;opacity:.9}
.nav-badge{margin-left:auto;background:var(--accent);color:#141414;font-size:11px;font-weight:700;border-radius:9px;padding:0 7px;line-height:17px}
.nav-badge.zero{display:none}
.rail-foot{padding:12px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--faint)}
.sync-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px}
.sync-dot.stale{background:var(--dim)}

#main{flex:1;min-width:0}
#topbar{display:flex;align-items:center;gap:14px;padding:14px 26px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(16,17,20,.92);backdrop-filter:blur(6px);z-index:20}
#page-title{font-family:var(--mono);font-weight:600;font-size:24px;letter-spacing:.04em;text-transform:uppercase}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
#app{padding:22px 26px 80px;max-width:1340px}

/* ---- primitives ---- */
.btn{background:var(--panel2);border:1px solid var(--line2);color:var(--txt);border-radius:6px;padding:7px 14px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#151515;font-weight:700}
.btn.primary:hover{filter:brightness(1.08);color:#151515}
.btn.danger{color:var(--red)}
.btn.danger:hover{border-color:var(--red)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--dim)}
.btn.ghost:hover{color:var(--accent);border-color:transparent}
input,select,textarea{background:var(--bg);border:1px solid var(--line2);border-radius:6px;color:var(--txt);padding:7px 10px;font-size:13.5px;font-family:var(--body)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input[type=number]{width:96px;text-align:right}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.12em;font-weight:600}
.grid{display:grid;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:16px}
.card.click{cursor:pointer;transition:border-color .12s}
.card.click:hover{border-color:var(--accent-dim)}
.sect-title{font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:26px 0 10px}
.sect-title:first-child{margin-top:0}
.muted{color:var(--dim)} .small{font-size:12px} .right{text-align:right}
.num{font-variant-numeric:tabular-nums}
.statv{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.chip{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:4px;padding:2px 7px;border:1px solid}
.chip.amber{color:var(--accent);border-color:var(--accent-dim);background:rgba(255,176,32,.07)}
.chip.green{color:#54c58a;border-color:#1d6b43;background:rgba(47,166,102,.09)}
.chip.blue{color:#7ab3ec;border-color:#2b568c;background:rgba(74,144,226,.09)}
.chip.red{color:var(--red);border-color:#7c332e;background:rgba(226,93,85,.08)}
.chip.gray{color:var(--dim);border-color:var(--line2);background:var(--panel2)}
.empty{padding:34px;text-align:center;color:var(--faint);border:1px dashed var(--line2);border-radius:var(--rad)}

/* ---- tables ---- */
table{width:100%;border-collapse:collapse}
.tbl th{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--faint);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;position:sticky;top:57px;background:var(--bg);z-index:5}
.card .tbl th{position:static;background:transparent}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--panel)}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.tot td{border-top:2px solid var(--line2);font-weight:700;background:var(--panel)}

/* ---- KPI strip ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:14px 16px}
.kpi .l{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .v{font-family:var(--mono);font-size:31px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:3px;line-height:1.05}
.kpi .s{font-size:11.5px;color:var(--faint);margin-top:2px}
.kpi.alert{border-color:var(--accent-dim);cursor:pointer}
.kpi.alert .v{color:var(--accent)}
.kpi .dot{width:8px;height:8px;border-radius:2px;display:inline-block}

/* ---- stage bars (ordered / billed / paid vs budget) ---- */
.stages{display:flex;flex-direction:column;gap:5px}
.stage{display:grid;grid-template-columns:56px 1fr 86px;gap:8px;align-items:center;font-size:12px}
.stage .sl{color:var(--dim);text-transform:uppercase;letter-spacing:.08em;font-size:10px;font-weight:600}
.stage .track{position:relative;height:10px;background:var(--line);border-radius:3px;overflow:visible}
.stage .fill{position:absolute;top:0;left:0;height:100%;border-radius:3px}
.stage .tick{position:absolute;top:-3px;width:2px;height:16px;background:var(--txt);opacity:.55}
.stage .sv{text-align:right;font-variant-numeric:tabular-nums;color:var(--txt);font-weight:600}

/* ---- job cards ---- */
.jobgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.jobcard .jname{font-family:var(--mono);font-size:21px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;line-height:1.1;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.jobcard .boards{display:flex;align-items:baseline;gap:6px;margin:10px 0 2px}
.jobcard .boards .bv{font-family:var(--mono);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.jobcard .spark{margin-top:10px}
.mini-meta{display:flex;gap:10px;font-size:11px;color:var(--faint);margin-top:9px;flex-wrap:wrap}

/* ---- job header ---- */
.job-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.job-head h2{font-family:var(--mono);font-size:34px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;line-height:1}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin-bottom:18px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line2);margin-bottom:16px;overflow-x:auto}
.tab{padding:9px 16px;cursor:pointer;color:var(--dim);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap;text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono);font-size:15px}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab:hover{color:var(--txt)}

/* ---- utilization bar ---- */
.util{position:relative;height:8px;background:var(--line);border-radius:3px;min-width:90px}
.util>i{position:absolute;left:0;top:0;height:100%;border-radius:3px;background:var(--ordered)}
.util>i.over{background:var(--red)}

/* ---- modal ---- */
#modal-root{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;background:rgba(0,0,0,.62);z-index:60;overflow-y:auto;padding:5vh 14px}
#modal-root.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:10px;width:100%;max-width:680px;margin-bottom:5vh}
.modal.wide{max-width:940px}
.modal-h{display:flex;align-items:center;padding:15px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{font-family:var(--mono);font-size:19px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.modal-x{margin-left:auto;background:none;border:none;color:var(--dim);font-size:21px;cursor:pointer;line-height:1}
.modal-x:hover{color:var(--txt)}
.modal-b{padding:18px 20px}
.modal-f{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);justify-content:flex-end;flex-wrap:wrap}
.frow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.frow .field{flex:1;min-width:130px}

/* ---- toast ---- */
#toast-root{position:fixed;bottom:18px;right:18px;z-index:90;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--accent);border-radius:6px;padding:11px 16px;font-size:13px;min-width:220px;box-shadow:0 6px 24px rgba(0,0,0,.5);animation:tin .18s ease-out}
.toast.err{border-left-color:var(--red)}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* ---- command palette ---- */
#pal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
#pal.open{display:flex}
.pal-box{background:var(--panel);border:1px solid var(--line2);border-radius:10px;width:94%;max-width:560px;overflow:hidden}
.pal-box input{width:100%;border:none;border-bottom:1px solid var(--line);background:transparent;padding:15px 18px;font-size:16px;border-radius:0}
.pal-list{max-height:340px;overflow-y:auto}
.pal-item{padding:10px 18px;cursor:pointer;display:flex;gap:10px;align-items:center}
.pal-item.sel,.pal-item:hover{background:var(--panel2)}
.pal-item .k{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.1em;width:64px;flex-shrink:0}

/* ---- review queue ---- */
.rq-row{border:1px solid var(--line);border-radius:var(--rad);background:var(--panel);margin-bottom:10px;overflow:hidden}
.rq-head{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;flex-wrap:wrap}
.rq-desc{font-weight:600;font-size:14.5px}
.rq-body{border-top:1px solid var(--line);padding:14px 16px;background:var(--panel2)}
.sugg{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.sugg .btn{display:flex;flex-direction:column;align-items:flex-start;padding:7px 12px}
.sugg .btn small{color:var(--faint);font-size:10.5px}

/* ---- tree (locations) ---- */
.tree{margin-left:0}
.tnode{border-left:2px solid var(--line2);margin:6px 0 6px 8px;padding-left:14px}
.tlabel{display:flex;align-items:center;gap:10px;padding:4px 0;flex-wrap:wrap}
.tlabel .tn{font-family:var(--mono);font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.04em}
.tstats{color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums}

@media (max-width:900px){
  #shell{flex-direction:column}
  #rail{width:100%;height:auto;position:static;flex-direction:row;align-items:center;overflow-x:auto}
  .rail-brand{border:none;padding:12px 14px;flex-shrink:0}
  .rail-nav{display:flex;padding:6px;flex:1}
  .nav-item{flex-shrink:0;border-left:none;border-bottom:2px solid transparent}
  .nav-item.on{border-left:none;border-bottom-color:var(--accent)}
  .rail-foot{display:none}
  #app{padding:16px 12px 70px}
  #topbar{padding:12px 14px}
  .tbl th{top:0}
}
</style>
</head>
<body>

<div id="login">
  <div class="login-box">
    <div class="wordmark">AA <b>DRYWALL</b></div>
    <div class="login-sub">Job Cost Command</div>
    <input id="pass" type="password" placeholder="PASSCODE" autocomplete="current-password">
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<div id="shell" style="display:none">
  <nav id="rail">
    <div class="rail-brand">
      <div class="wm">AA <b>DRYWALL</b></div>
      <div class="sub">Job Cost Command</div>
    </div>
    <div class="rail-nav" id="nav"></div>
    <div class="rail-foot"><span class="sync-dot" id="sync-dot"></span><span id="sync-txt">live</span></div>
  </nav>
  <div id="main">
    <div id="topbar">
      <div id="page-title">Dashboard</div>
      <div class="top-actions">
        <button class="btn ghost" onclick="ui.openPal()" title="Search (Ctrl+K)">⌘K Search</button>
        <button class="btn ghost" onclick="ui.refresh()" title="Refresh">↻</button>
      </div>
    </div>
    <div id="app"></div>
  </div>
</div>

<div id="modal-root"></div>
<div id="pal"><div class="pal-box"><input id="pal-in" placeholder="Jump to job, material, page…"><div class="pal-list" id="pal-list"></div></div></div>
<div id="toast-root"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SB_URL = 'https://svvjsumhkbezbyskxxej.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2dmpzdW1oa2JlemJ5c2t4eGVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMjYxNzMsImV4cCI6MjA5MTcwMjE3M30.91A6_m36yMsOr2vofpH7wTVVnCtpuM2hssy1K-vStRQ';
const sb = createClient(SB_URL, SB_KEY);

/* ============================== state ============================== */
const S = {
  auth:false, settings:null,
  jobs:[], mats:[], vendors:[], sums:[],
  reviewCount:0, poNoJob:0, billNoJob:0,
  route:['dash'],
  jobCache:{},
};
const CATS = ['board','metal_framing','lumber','sheet_goods','fasteners','finishing','sealants','insulation','tools_supplies','labor','tax_fees','misc'];
const CATLABEL = {board:'Board',metal_framing:'Metal Framing',lumber:'Lumber',sheet_goods:'Sheet Goods',fasteners:'Fasteners',finishing:'Finishing',sealants:'Sealants',insulation:'Insulation',tools_supplies:'Tools & Supplies',labor:'Labor',tax_fees:'Tax & Fees',misc:'Misc',uncategorized:'— Unmapped —'};

/* ============================== utils ============================== */
const $ = (s)=>document.querySelector(s);
const esc = (s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n,c)=> (n==null?'—':'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:c?2:0,maximumFractionDigits:c?2:0}));
const qty = (n)=> n==null?'—':Number(n).toLocaleString('en-US',{maximumFractionDigits:1});
const dt = (d)=> d? new Date(String(d).length===10? d+'T12:00:00': d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'}):'—';
const jn = (name)=> String(name||'').replace(/^JOB\s+/i,'');
const jobById = (id)=> S.jobs.find(j=>j.id===id);
const matById = (id)=> S.mats.find(m=>m.id===id);
const sumById = (id)=> S.sums.find(s=>s.job_id===id);
function toast(msg, err){ const t=document.createElement('div'); t.className='toast'+(err?' err':''); t.textContent=msg;
  $('#toast-root').appendChild(t); setTimeout(()=>t.remove(), err?6000:3200); }
function fail(e){ console.error(e); toast((e?.message||e||'error').toString().slice(0,160), true); }
async function q(p){ const {data,error}=await p; if(error) throw error; return data; }
// paginate past PostgREST's 1000-row cap
async function qAll(makeQuery){
  const out=[]; let from=0; const page=1000;
  for(;;){ const rows = await q(makeQuery().range(from, from+page-1));
    out.push(...rows); if(rows.length<page) break; from+=page; }
  return out;
}
async function audit(action, entity, entity_id, detail){ try{ await sb.from('app_audit').insert({action, entity, entity_id:String(entity_id??''), detail, actor:'ui'});}catch(e){console.warn(e);} }
const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};

/* ============================== auth ============================== */
async function boot(){
  try{ S.settings = (await q(sb.from('settings').select('*').limit(1)))[0] || {passcode:'GYPSUM'}; }
  catch(e){ S.settings={passcode:'GYPSUM'}; }
  const saved = localStorage.getItem('aadw_key');
  if(saved && saved === btoa('k:'+S.settings.passcode)) return enter();
  $('#pass').addEventListener('keydown', e=>{
    if(e.key!=='Enter') return;
    if($('#pass').value.trim().toUpperCase() === String(S.settings.passcode).toUpperCase()){
      localStorage.setItem('aadw_key', btoa('k:'+S.settings.passcode)); enter();
    } else { $('#login-err').textContent='WRONG PASSCODE'; $('#pass').value=''; }
  });
  $('#pass').focus();
}
async function enter(){
  S.auth=true; $('#login').style.display='none'; $('#shell').style.display='flex';
  await loadCore(); route(); subscribeRealtime();
  setInterval(()=>loadCore(), 90000);
}

/* ============================== core data ============================== */
async function loadCore(){
  try{
    const [jobs, mats, vendors, sums, rq, pnj, bnj] = await Promise.all([
      q(sb.from('jobs').select('*').order('active',{ascending:false}).order('name')),
      q(sb.from('materials').select('*').order('name')),
      q(sb.from('vendors').select('*').order('name')),
      q(sb.from('v_job_summary').select('*')),
      sb.from('v_review_queue').select('*',{count:'exact',head:true}),
      sb.from('purchase_orders').select('*',{count:'exact',head:true}).is('job_id',null),
      sb.from('bills').select('*',{count:'exact',head:true}).is('job_id',null),
    ]);
    S.jobs=jobs; S.mats=mats; S.vendors=vendors; S.sums=sums;
    S.reviewCount=rq.count||0; S.poNoJob=pnj.count||0; S.billNoJob=bnj.count||0;
    renderNav();
  }catch(e){ fail(e); }
}

/* ============================== realtime ============================== */
function subscribeRealtime(){
  const onchange = debounce(async ()=>{ await loadCore(); route(true); $('#sync-txt').textContent='live · '+new Date().toLocaleTimeString(); }, 900);
  sb.channel('db')
    .on('postgres_changes',{event:'*',schema:'public',table:'purchase_orders'},onchange)
    .on('postgres_changes',{event:'*',schema:'public',table:'po_line_items'},onchange)
    .on('postgres_changes',{event:'*',schema:'public',table:'bills'},onchange)
    .on('postgres_changes',{event:'*',schema:'public',table:'bill_line_items'},onchange)
    .on('postgres_changes',{event:'*',schema:'public',table:'budgets'},onchange)
    .on('postgres_changes',{event:'*',schema:'public',table:'materials'},onchange)
    .on('postgres_changes',{event:'*',schema:'public',table:'jobs'},onchange)
    .subscribe((st)=>{ $('#sync-dot').classList.toggle('stale', st!=='SUBSCRIBED'); });
}

/* ============================== nav + router ============================== */
const NAV = [
  ['dash','▦','Dashboard'], ['review','◈','Review Queue'], ['pos','⬒','Purchase Orders'],
  ['bills','▤','Bills'], ['materials','▩','Materials'], ['vendors','⛟','Vendors'], ['activity','≡','Activity & Settings'],
];
function renderNav(){
  const cur = S.route[0]==='job' ? 'dash' : S.route[0];
  const badge = S.reviewCount + S.poNoJob + S.billNoJob;
  $('#nav').innerHTML = NAV.map(([r,ic,l])=>`
    <div class="nav-item ${cur===r?'on':''}" onclick="location.hash='#/${r}'">
      <span class="ic">${ic}</span>${l}
      ${r==='review'?`<span class="nav-badge ${badge?'':'zero'}">${badge}</span>`:''}
    </div>`).join('');
}
window.addEventListener('hashchange', ()=>route());
function route(soft){
  const h = location.hash.replace(/^#\//,'') || 'dash';
  S.route = h.split('/');
  renderNav();
  const r = S.route[0];
  const T = {dash:'Dashboard',review:'Review Queue',pos:'Purchase Orders',bills:'Bills',materials:'Materials',vendors:'Vendors',activity:'Activity & Settings'};
  $('#page-title').textContent = T[r] || 'Job';
  if(r==='dash') return renderDash();
  if(r==='job') return renderJob(S.route[1], S.route[2]||'costs');
  if(r==='review') return renderReview();
  if(r==='pos') return renderPOs();
  if(r==='bills') return renderBills();
  if(r==='materials') return renderMaterials();
  if(r==='vendors') return renderVendors();
  if(r==='activity') return renderActivity();
  renderDash();
}

/* ============================== charts (validated palette) ============================== */
function stageBars(budget, ordered, billed, paid){
  const max = Math.max(budget, ordered, billed, 1);
  const pct = v => Math.min(100, v/max*100);
  const tick = budget>0 ? `<span class="tick" style="left:${pct(budget)}%"></span>` : '';
  const row = (label,val,color)=>`
    <div class="stage"><span class="sl">${label}</span>
      <span class="track"><span class="fill" style="width:${pct(val)}%;background:${color}"></span>${tick}</span>
      <span class="sv">${money(val)}</span></div>`;
  return `<div class="stages">${row('Ordered',ordered,'var(--ordered)')}${row('Billed',billed,'var(--billed)')}${row('Paid',paid,'var(--paid)')}</div>`;
}
function spark(points, w=290, h=40){
  if(!points || points.length<2) return `<div class="muted small">no trend data</div>`;
  const max = Math.max(...points.map(p=>p.v),1);
  const step = w/(points.length-1);
  const xy = points.map((p,i)=>[i*step, h-4-(p.v/max)*(h-10)]);
  const line = xy.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ');
  const area = `0,${h} ${line} ${w},${h}`;
  const last = xy[xy.length-1];
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="max-width:100%">
    <title>weekly ordered $ — latest ${money(points[points.length-1].v)}</title>
    <polygon points="${area}" fill="rgba(199,127,10,.14)"/>
    <polyline points="${line}" fill="none" stroke="var(--ordered)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="var(--ordered)"/>
  </svg>`;
}
function utilBar(usedPct){
  const over = usedPct>100;
  return `<div class="util"><i class="${over?'over':''}" style="width:${Math.min(100,usedPct)}%"></i></div>`;
}

/* ============================== DASHBOARD ============================== */
async function renderDash(){
  const act = S.sums.filter(s=>s.active);
  const tot = (k)=> act.reduce((a,s)=>a+Number(s[k]||0),0);
  const exposure = tot('ordered_cost')-tot('billed_cost');
  const attention = S.reviewCount + S.poNoJob + S.billNoJob;

  let weekly=[];
  try{
    const since = new Date(Date.now()-84*86400e3).toISOString().slice(0,10);
    weekly = await q(sb.from('v_weekly_spend').select('*').gte('week',since));
  }catch(e){ console.warn(e); }
  const wkByJob = {};
  weekly.forEach(w=>{ (wkByJob[w.job_id]=wkByJob[w.job_id]||{})[w.week]=Number(w.ordered_cost||0); });
  const weeks=[]; for(let i=11;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-d.getDay()+1-i*7); weeks.push(d.toISOString().slice(0,10)); }

  const cards = act.sort((a,b)=> (b.last_activity||'').localeCompare(a.last_activity||'')).map(s=>{
    const pts = weeks.map(w=>({v:(wkByJob[s.job_id]||{})[w]||0}));
    const bBud = Number(s.boards_budget||0), bOrd = Number(s.boards_ordered||0);
    return `<div class="card click jobcard" onclick="location.hash='#/job/${s.job_id}'">
      <div class="jname">${esc(jn(s.name))} ${s.unmapped_lines>0?`<span class="chip amber">${s.unmapped_lines} unmapped</span>`:''}</div>
      <div class="boards"><span class="bv">${qty(bOrd)}</span>
        <span class="muted small">boards ordered${bBud?` / ${qty(bBud)} budget`:''}</span></div>
      ${bBud? utilBar(bOrd/bBud*100):''}
      <div style="margin-top:12px">${stageBars(Number(s.material_budget||0), Number(s.ordered_cost||0), Number(s.billed_cost||0), Number(s.paid_cost||0))}</div>
      ${spark(pts)}
      <div class="mini-meta">
        <span>last activity ${dt(s.last_activity)}</span>
        ${s.target_price_per_board?`<span>target ${money(s.target_price_per_board)}/board</span>`:''}
      </div>
    </div>`;
  }).join('');

  const inact = S.sums.filter(s=>!s.active && (s.ordered_cost>0||s.billed_cost>0));
  $('#app').innerHTML = `
    <div class="kpis">
      <div class="kpi alert" onclick="location.hash='#/review'">
        <div class="l"><span class="dot" style="background:var(--accent)"></span>Needs Attention</div>
        <div class="v">${attention}</div>
        <div class="s">${S.reviewCount} materials · ${S.poNoJob} POs · ${S.billNoJob} bills</div>
      </div>
      <div class="kpi"><div class="l"><span class="dot" style="background:var(--ordered)"></span>Open Exposure</div>
        <div class="v">${money(exposure)}</div><div class="s">ordered, not yet billed</div></div>
      <div class="kpi"><div class="l"><span class="dot" style="background:var(--ordered)"></span>Ordered</div>
        <div class="v">${money(tot('ordered_cost'))}</div><div class="s">active jobs</div></div>
      <div class="kpi"><div class="l"><span class="dot" style="background:var(--billed)"></span>Billed</div>
        <div class="v">${money(tot('billed_cost'))}</div><div class="s">active jobs</div></div>
      <div class="kpi"><div class="l"><span class="dot" style="background:var(--paid)"></span>Paid</div>
        <div class="v">${money(tot('paid_cost'))}</div><div class="s">from QuickBooks balance</div></div>
    </div>
    <div class="sect-title">Active Jobs <button class="btn sm" style="margin-left:10px" onclick="ui.newJob()">+ New Job</button></div>
    <div class="jobgrid">${cards || '<div class="empty">No active jobs</div>'}</div>
    ${inact.length?`<div class="sect-title">Past Jobs</div>
      <div class="card" style="padding:0;overflow-x:auto"><table class="tbl"><tbody>
      ${inact.map(s=>`<tr class="click" onclick="location.hash='#/job/${s.job_id}'">
        <td>${esc(jn(s.name))}</td><td class="r muted">${qty(s.boards_ordered)} boards</td>
        <td class="r">${money(s.ordered_cost)} ordered</td><td class="r">${money(s.billed_cost)} billed</td><td class="r">${money(s.paid_cost)} paid</td></tr>`).join('')}
      </tbody></table></div>`:''}
  `;
}

/* ============================== JOB PAGE ============================== */
async function renderJob(jobId, tab){
  const job = jobById(jobId); const sum = sumById(jobId);
  if(!job){ $('#app').innerHTML='<div class="empty">Job not found</div>'; return; }
  $('#page-title').textContent = jn(job.name);

  let J = S.jobCache[jobId];
  if(!J || J.stale){
    try{
      const [cats, fams, locs, pos, budgets, buildings, floors, units] = await Promise.all([
        q(sb.from('v_job_category').select('*').eq('job_id',jobId)),
        q(sb.from('v_job_family').select('*').eq('job_id',jobId)),
        q(sb.from('v_job_locations').select('*').eq('job_id',jobId)),
        q(sb.from('v_job_pos').select('*').eq('job_id',jobId).order('po_date',{ascending:false,nullsFirst:false})),
        q(sb.from('budgets').select('*').eq('job_id',jobId)),
        q(sb.from('buildings').select('*').eq('job_id',jobId).order('name')),
        q(sb.from('floors').select('*, buildings!inner(job_id)').eq('buildings.job_id',jobId)),
        qAll(()=>sb.from('units').select('*, floors!inner(building_id, buildings!inner(job_id))').eq('floors.buildings.job_id',jobId)),
      ]);
      J = S.jobCache[jobId] = {cats, fams, locs, pos, budgets, buildings, floors, units, stale:false};
    }catch(e){ return fail(e); }
  }

  const matBudget = Number(sum?.material_budget||0), ordered=Number(sum?.ordered_cost||0),
        billed=Number(sum?.billed_cost||0), paid=Number(sum?.paid_cost||0),
        laborBud=Number(sum?.labor_budget||0), contBud=Number(sum?.contingency_budget||0);
  const unplanned = J.cats.filter(c=>Number(c.budget_cost)==0 && Number(c.budget_qty)==0 && !['tax_fees','labor'].includes(c.category))
                          .reduce((a,c)=>a+Number(c.ordered_cost||0),0);
  const variance = matBudget>0? matBudget-ordered : null;
  const laborBilled = J.cats.filter(c=>c.category==='labor').reduce((a,c)=>a+Number(c.billed_cost||0),0);

  const stat = (l,v,s,color)=>`<div class="kpi"><div class="l">${l}</div><div class="v" ${color?`style="color:${color}"`:''} >${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`;

  const tabs = [['costs','Cost Breakdown'],['budget','Budget'],['pos','POs'],['bills','Bills'],['locations','Locations']];
  $('#app').innerHTML = `
    <div class="job-head">
      <div>
        <h2>${esc(jn(job.name))} ${job.active?'':'<span class="chip gray">inactive</span>'}</h2>
        <div class="muted small">${esc(job.address||'')} ${job.aliases?.length?` · aka ${esc(job.aliases.join(', '))}`:''}</div>
      </div>
      <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" onclick="ui.editJob('${jobId}')">Edit</button>
        <button class="btn ${job.active?'':'primary'}" onclick="ui.toggleJob('${jobId}')">${job.active?'Deactivate':'Reactivate'}</button>
        <button class="btn danger" onclick="ui.deleteJob('${jobId}')">Delete</button>
      </div>
    </div>
    <div class="statrow">
      ${stat('Budget (Mat)', money(matBudget))}
      ${stat('Ordered', money(ordered),'','var(--ordered)')}
      ${stat('Billed', money(billed),'','var(--billed)')}
      ${stat('Paid', money(paid),'','var(--paid)')}
      ${stat('Variance', variance==null?'—':money(variance), variance!=null&&variance<0?'over budget':'vs material budget', variance!=null&&variance<0?'var(--red)':'var(--green)')}
      ${stat('Boards', qty(sum?.boards_ordered), (Number(sum?.boards_budget)>0?`of ${qty(sum.boards_budget)} budget`:'ordered'))}
      ${stat('Labor', money(laborBilled), laborBud?`of ${money(laborBud)} budget`:'billed')}
      ${stat('Contingency', money(unplanned), contBud?`of ${money(contBud)} buffer`:'unplanned spend', contBud&&unplanned>contBud?'var(--red)':undefined)}
    </div>
    <div class="tabs">${tabs.map(([t,l])=>`<div class="tab ${tab===t?'on':''}" onclick="location.hash='#/job/${jobId}/${t}'">${l}</div>`).join('')}</div>
    <div id="jobtab"></div>
  `;
  if(tab==='costs') renderJobCosts(jobId, J);
  else if(tab==='budget') renderJobBudget(jobId, J);
  else if(tab==='pos') renderJobPOs(jobId, J);
  else if(tab==='bills') renderJobBills(jobId);
  else if(tab==='locations') renderJobLocations(jobId, J);
}

/* ---- costs tab: category -> family drilldown ---- */
function renderJobCosts(jobId, J){
  const byCat = {};
  J.cats.forEach(c=>byCat[c.category]=c);
  const order = [...CATS.filter(c=>byCat[c]), ...Object.keys(byCat).filter(c=>!CATS.includes(c))];
  const rows = order.map(cat=>{
    const c = byCat[cat];
    const pct = Number(c.budget_cost)>0 ? Number(c.ordered_cost)/Number(c.budget_cost)*100 : null;
    return `<tr class="click" onclick="ui.toggleCat('${jobId}','${esc(cat)}')">
      <td><b>${CATLABEL[cat]||esc(cat)}</b></td>
      <td class="r muted">${Number(c.budget_qty)>0?qty(c.budget_qty):''}</td>
      <td class="r">${Number(c.budget_cost)>0?money(c.budget_cost):'<span class="muted">—</span>'}</td>
      <td class="r" style="color:var(--ordered)">${money(c.ordered_cost)}</td>
      <td class="r" style="color:var(--billed)">${money(c.billed_cost)}</td>
      <td class="r" style="color:var(--paid)">${money(c.paid_cost)}</td>
      <td style="width:110px">${pct!=null?utilBar(pct):''}</td>
      <td class="r muted small">${pct!=null? Math.round(pct)+'%':''}</td>
    </tr>
    <tr id="cat-${cssId(cat)}" style="display:none"><td colspan="8" style="padding:0;background:var(--panel)"></td></tr>`;
  }).join('');
  const t = J.cats.reduce((a,c)=>({b:a.b+Number(c.budget_cost||0),o:a.o+Number(c.ordered_cost||0),bi:a.bi+Number(c.billed_cost||0),p:a.p+Number(c.paid_cost||0)}),{b:0,o:0,bi:0,p:0});
  $('#jobtab').innerHTML = `
    <div class="card" style="padding:0;overflow-x:auto">
    <table class="tbl"><thead><tr>
      <th>Category</th><th class="r">Bud Qty</th><th class="r">Budget $</th><th class="r">Ordered</th><th class="r">Billed</th><th class="r">Paid</th><th>Utilization</th><th></th>
    </tr></thead><tbody>${rows}
      <tr class="tot"><td>Total</td><td></td><td class="r">${money(t.b)}</td><td class="r">${money(t.o)}</td><td class="r">${money(t.bi)}</td><td class="r">${money(t.p)}</td><td></td><td></td></tr>
    </tbody></table></div>
    <div class="muted small" style="margin-top:8px">Click a category to see materials. Amounts include historical backfill.</div>`;
}
const cssId = (s)=>String(s).replace(/[^a-z0-9]/gi,'_');
window.ui = window.ui || {};
ui.toggleCat = (jobId, cat)=>{
  const tr = $('#cat-'+cssId(cat)); if(!tr) return;
  if(tr.style.display!=='none'){ tr.style.display='none'; return; }
  const J = S.jobCache[jobId];
  const rows = J.fams.filter(f=>f.category===cat).sort((a,b)=>Number(b.total)-Number(a.total)).map(f=>
    `<tr class="click" data-k="${esc(f.family)}" onclick="ui.familyLines('${jobId}','${esc(cat)}',this.dataset.k)">
       <td style="padding-left:26px">${esc(f.family)}</td><td class="r">${qty(f.qty)} ${esc(f.uom)}</td>
       <td class="r">${money(f.total)}</td><td class="r muted small">${f.lines} lines</td></tr>`).join('');
  tr.style.display=''; tr.firstElementChild.innerHTML =
    `<table class="tbl">${rows||'<tr><td class="muted" style="padding-left:26px">no lines</td></tr>'}</table>`;
};
ui.familyLines = async (jobId, cat, fam)=>{
  let all=[];
  try{
    all = await qAll(()=>sb.from('v_po_lines')
      .select('po_id,po_number,po_date,vendor_name,raw_description,qty,unit_cost,line_total,family,material_name,category,building_name,floor_number,unit_number')
      .eq('job_id',jobId).eq(cat==='uncategorized'?'needs_mapping':'category', cat==='uncategorized'?true:cat));
  }catch(e){ return fail(e); }
  const lines = all.filter(l=>(l.family||l.material_name||l.raw_description||'(blank)')===fam || fam==='(blank)'&&!(l.family||l.material_name||l.raw_description))
                   .sort((a,b)=>(b.po_date||'').localeCompare(a.po_date||''));
  openModal(`${esc(fam)}`, `
    <div style="max-height:56vh;overflow:auto"><table class="tbl"><thead><tr>
    <th>PO</th><th>Date</th><th>Vendor</th><th>Description</th><th class="r">Qty</th><th class="r">Cost</th><th class="r">Total</th><th>Loc</th></tr></thead><tbody>
    ${lines.map(l=>`<tr class="click" onclick="closeModal();ui.openPO('${l.po_id}')">
      <td>${esc(l.po_number)}</td><td class="small muted">${dt(l.po_date)}</td><td class="small">${esc(l.vendor_name||'')}</td>
      <td class="small">${esc(l.raw_description)}</td><td class="r">${qty(l.qty)}</td><td class="r">${money(l.unit_cost,1)}</td>
      <td class="r">${money(l.line_total)}</td><td class="small muted">${[l.building_name,l.floor_number,l.unit_number].filter(Boolean).join('/')}</td></tr>`).join('')}
    </tbody></table></div>`, null, true);
};

/* ---- budget tab ---- */
function renderJobBudget(jobId, J){
  const mats = J.budgets.filter(b=>b.kind==='material' && !b.building_id);
  const scoped = J.budgets.filter(b=>b.kind==='material' && b.building_id);
  const labor = J.budgets.filter(b=>b.kind==='labor');
  const cont = J.budgets.find(b=>b.kind==='contingency');
  const mrow = (b)=>{
    const m = matById(b.material_id);
    return `<tr>
      <td>${m?esc(m.name):(b.category?`<i>${CATLABEL[b.category]||esc(b.category)} (category)</i>`:`<i>${esc(b.notes||'total')}</i>`)}</td>
      <td class="r"><input type="number" value="${Number(b.budget_qty)||''}" placeholder="qty" onchange="ui.saveBudget('${b.id}','budget_qty',this.value,'${jobId}')"></td>
      <td class="r"><input type="number" value="${Number(b.budget_cost)||''}" placeholder="$" onchange="ui.saveBudget('${b.id}','budget_cost',this.value,'${jobId}')"></td>
      <td class="r muted small">${m?esc(m.uom):''}</td>
      <td class="r"><button class="btn sm danger" onclick="ui.delBudget('${b.id}','${jobId}')">✕</button></td></tr>`;
  };
  $('#jobtab').innerHTML = `
    <div class="grid" style="grid-template-columns:1fr;max-width:860px">
      <div class="card">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap">
          <b>Material estimate</b><span class="muted small">the baseline actuals are measured against</span>
          <button class="btn sm" style="margin-left:auto" onclick="ui.addBudgetLine('${jobId}')">+ Material line</button>
        </div>
        <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Material</th><th class="r">Qty</th><th class="r">Budget $</th><th></th><th></th></tr></thead>
        <tbody>${mats.map(mrow).join('')||'<tr><td colspan="5" class="muted">No estimate lines yet</td></tr>'}</tbody></table></div>
      </div>
      <div class="card">
        <div style="display:flex;align-items:center;margin-bottom:8px"><b>Contingency / misc buffer</b>
          <span class="muted small" style="margin-left:10px">absorbs small unplanned items</span></div>
        ${cont? `<div style="display:flex;gap:10px;align-items:center">
          <input type="number" value="${Number(cont.budget_cost)||''}" onchange="ui.saveBudget('${cont.id}','budget_cost',this.value,'${jobId}')">
          <span class="muted small">buffer $</span></div>`
        : `<button class="btn sm" onclick="ui.addContingency('${jobId}')">+ Add buffer</button>`}
      </div>
      <div class="card">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><b>Labor budget</b>
          <button class="btn sm" style="margin-left:auto" onclick="ui.addLaborLine('${jobId}')">+ Labor line</button></div>
        <table class="tbl"><tbody>
          ${labor.map(b=>`<tr><td><input value="${esc(b.notes||'')}" onchange="ui.saveBudget('${b.id}','notes',this.value,'${jobId}')"></td>
            <td class="r"><input type="number" value="${Number(b.budget_cost)||''}" onchange="ui.saveBudget('${b.id}','budget_cost',this.value,'${jobId}')"></td>
            <td class="r"><button class="btn sm danger" onclick="ui.delBudget('${b.id}','${jobId}')">✕</button></td></tr>`).join('')||'<tr><td class="muted">No labor budget lines</td></tr>'}
        </tbody></table>
      </div>
      ${scoped.length?`<div class="card"><b>Per-building allocations</b>
        <table class="tbl"><tbody>${scoped.map(b=>{
          const m=matById(b.material_id); const bl=J.buildings.find(x=>x.id===b.building_id);
          return `<tr><td class="muted">Bldg ${esc(bl?.name||'?')}</td><td>${m?esc(m.name):esc(b.category||'')}</td>
          <td class="r"><input type="number" value="${Number(b.budget_qty)||''}" onchange="ui.saveBudget('${b.id}','budget_qty',this.value,'${jobId}')"></td>
          <td class="r"><button class="btn sm danger" onclick="ui.delBudget('${b.id}','${jobId}')">✕</button></td></tr>`;}).join('')}
        </tbody></table></div>`:''}
    </div>`;
}
ui.saveBudget = async (id, field, val, jobId)=>{
  try{ await q(sb.from('budgets').update({[field]: field==='notes'? val : (Number(val)||0)}).eq('id',id).select()); staleJob(jobId); toast('Budget saved'); await loadCore(); }
  catch(e){ fail(e); }
};
ui.delBudget = async (id, jobId)=>{
  if(!confirm('Delete this budget line?')) return;
  try{ await q(sb.from('budgets').delete().eq('id',id).select()); await audit('delete','budgets',id,{}); staleJob(jobId); toast('Deleted'); await loadCore(); renderJob(jobId,'budget'); }catch(e){ fail(e); }
};

function payChip(b){
  if(b.payment_status==='paid') return '<span class="chip green">Paid</span>';
  if(b.payment_status==='partial') return '<span class="chip blue">Partial</span>';
  return '<span class="chip amber">Unpaid</span>';
}
function srcChip(s){
  if(s==='qb') return '<span class="chip blue" title="QuickBooks sync">QB</span>';
  if(s==='backfill') return '<span class="chip gray">HIST</span>';
  if(s==='manual') return '<span class="chip gray">MAN</span>';
  if(s&&String(s).startsWith('email')) return '<span class="chip gray" title="Email PDF">PDF</span>';
  if(s==='legacy') return '<span class="chip gray">LEG</span>';
  return '';
}
function billTable(bills){
  return `<div class="card" style="padding:0;overflow-x:auto"><table class="tbl">

      <td class="r">${money(b.total)}</td><td class="r">${money(b.balance)}</td><td>${payChip(b)}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">No bills yet — QuickBooks sync runs daily</td></tr>'}

/* ---- locations tab ---- */
function renderJobLocations(jobId, J){
  const agg=(b,f,u)=>{ let t=0,bd=0; J.locs.forEach(l=>{
    if(b!==undefined&&(l.building_name||'')!==b)return;
    if(f!==undefined&&(l.floor_number||'')!==f)return;
    if(u!==undefined&&(l.unit_number||'')!==u)return;
    t+=Number(l.total||0); bd+=Number(l.boards||0);});
    return {t,bd}; };
  const html = J.buildings.map(b=>{
    const floors = J.floors.filter(f=>f.building_id===b.id).sort((x,y)=>Number(x.floor_number)-Number(y.floor_number));
    const ab = agg(b.name);
    return `<div class="tnode">
      <div class="tlabel"><span class="tn">Bldg ${esc(b.name)}</span>
        <span class="tstats">${money(ab.t)} · ${qty(ab.bd)} boards</span>
        <button class="btn sm ghost" onclick="ui.addFloor('${jobId}','${b.id}')">+ floor</button>
        <button class="btn sm ghost danger" onclick="ui.delLoc('${jobId}','buildings','${b.id}','Bldg ${esc(b.name)}')">✕</button></div>
      ${floors.map(f=>{
        const units = J.units.filter(u=>u.floor_id===f.id).sort((x,y)=>String(x.unit_number).localeCompare(String(y.unit_number),undefined,{numeric:true}));
        const af = agg(b.name, f.floor_number);
        return `<div class="tnode"><div class="tlabel"><span class="tn" style="font-size:14px">Floor ${esc(f.floor_number)}</span>
          <span class="tstats">${money(af.t)} · ${qty(af.bd)} boards</span>
          <button class="btn sm ghost" onclick="ui.addUnit('${jobId}','${f.id}')">+ unit</button>
          <button class="btn sm ghost danger" onclick="ui.delLoc('${jobId}','floors','${f.id}','Floor ${esc(f.floor_number)}')">✕</button></div>
          ${units.length?`<div class="small muted" style="padding:2px 0 4px">${units.map(u=>{
            const au=agg(b.name,f.floor_number,u.unit_number);
            return `<span style="display:inline-block;border:1px solid var(--line2);border-radius:4px;padding:2px 8px;margin:2px" title="${money(au.t)}">${esc(u.unit_number)}${au.bd?` <b>${qty(au.bd)}</b>`:''}</span>`;
          }).join('')}</div>`:''}
        </div>`;}).join('')}
    </div>`;}).join('');
  $('#jobtab').innerHTML = `
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <button class="btn sm" onclick="ui.addBuilding('${jobId}')">+ Building</button>
      <span class="muted small" style="align-self:center">unit chips show board count · hover for $</span></div>
    <div class="card tree">${html||'<div class="empty">No buildings yet</div>'}</div>`;
}

ui.delLoc = async (jobId, table, id, label)=>{
  if(!confirm(`Delete ${label}? POs assigned to it keep their data but lose this location tag.`)) return;
  try{
    if(table==='buildings'){ await sb.from('purchase_orders').update({building_id:null,floor_id:null,unit_id:null}).eq('building_id',id); await sb.from('bills').update({building_id:null,floor_id:null,unit_id:null}).eq('building_id',id); }
    if(table==='floors'){ await sb.from('purchase_orders').update({floor_id:null,unit_id:null}).eq('floor_id',id); await sb.from('bills').update({floor_id:null,unit_id:null}).eq('floor_id',id); }
    if(table==='units'){ await sb.from('purchase_orders').update({unit_id:null}).eq('unit_id',id); await sb.from('bills').update({unit_id:null}).eq('unit_id',id); }
    await q(sb.from(table).delete().eq('id',id).select());
    await audit('delete', table, id, {label}); staleJob(jobId); toast('Deleted'); renderJob(jobId,'locations');
  }catch(e){ fail(e); }

      <div class="field"><label>Total</label><input id="po-total" type="number" value="${Number(po.total)||''}"></div>

function matPickerInline(cls, sel){

async function locSelects(jobId, b, f, u){
  if(!jobId) return '<div class="muted small">assign a job to set location</div>';
  try{
    const [bs, fs, us] = await Promise.all([
      q(sb.from('buildings').select('*').eq('job_id',jobId).order('name')),
      q(sb.from('floors').select('*, buildings!inner(job_id)').eq('buildings.job_id',jobId)),
      q(sb.from('units').select('*, floors!inner(building_id, buildings!inner(job_id))').eq('floors.buildings.job_id',jobId)),
    ]);
    const fs2 = b? fs.filter(x=>x.building_id===b):fs;
    const us2 = f? us.filter(x=>x.floor_id===f):us;
    return `
      <div class="field"><label>Building</label><select id="po-b"><option value="">—</option>${bs.map(x=>`<option value="${x.id}" ${x.id===b?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Floor</label><select id="po-f"><option value="">—</option>${fs2.map(x=>`<option value="${x.id}" ${x.id===f?'selected':''}>${esc(x.floor_number)}</option>`).join('')}</select></div>
      <div class="field"><label>Unit</label><select id="po-u"><option value="">—</option>${us2.map(x=>`<option value="${x.id}" ${x.id===u?'selected':''}>${esc(x.unit_number)}</option>`).join('')}</select></div>`;
  }catch(e){ return '<div class="muted small">location load failed</div>'; }
}

async function renderPOs(){
  const f = S.poFilter = S.poFilter||{job:'',vendor:'',src:'',qtext:''};
  let query = sb.from('purchase_orders').select('*, vendors(name), jobs(name)').order('po_date',{ascending:false,nullsFirst:false}).limit(400);
  if(f.job) query=query.eq('job_id',f.job);
  if(f.vendor) query=query.eq('vendor_id',f.vendor);
  if(f.src) query=query.eq('source',f.src);
  if(f.qtext) query=query.ilike('po_number',`%${f.qtext}%`);
  let pos=[]; try{ pos = await q(query); }catch(e){ return fail(e); }
  $('#app').innerHTML = `
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
      <input placeholder="PO #…" value="${esc(f.qtext)}" onchange="ui.poF('qtext',this.value)" style="width:120px">
      <select onchange="ui.poF('job',this.value)"><option value="">All jobs</option>${S.jobs.map(x=>`<option value="${x.id}" ${f.job===x.id?'selected':''}>${esc(jn(x.name))}</option>`).join('')}</select>
      <select onchange="ui.poF('vendor',this.value)"><option value="">All vendors</option>${S.vendors.map(v=>`<option value="${v.id}" ${f.vendor===v.id?'selected':''}>${esc(v.name)}</option>`).join('')}</select>
      <select onchange="ui.poF('src',this.value)"><option value="">All sources</option>
        <option value="qb" ${f.src==='qb'?'selected':''}>QuickBooks</option><option value="pdf" ${f.src==='pdf'?'selected':''}>PDF</option>
        <option value="email" ${f.src==='email'?'selected':''}>Email</option>
        <option value="manual" ${f.src==='manual'?'selected':''}>Manual</option><option value="backfill" ${f.src==='backfill'?'selected':''}>Historical</option></select>
      <button class="btn sm primary" style="margin-left:auto" onclick="ui.newPO()">+ Manual PO</button>
    </div>
    <div class="card" style="padding:0;overflow-x:auto"><table class="tbl">
      <thead><tr><th>PO #</th><th>Date</th><th>Job</th><th>Vendor</th><th class="r">Total</th><th>QB</th></tr></thead>
      <tbody>${pos.map(p=>`<tr class="click" onclick="ui.openPO('${p.id}')">
        <td><b>${esc(p.po_number)}</b> ${srcChip(p.source)}</td><td>${dt(p.po_date)}</td>
        <td>${p.job_id?esc(jn(p.jobs?.name||'')):'<span class="chip amber">no job</span>'}</td>
        <td class="small">${esc(p.vendors?.name||'')}</td><td class="r">${money(p.total)}</td>
        <td class="small muted">${esc(p.qb_status||'')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No POs match</td></tr>'}
      </tbody></table></div>
    <div class="muted small" style="margin-top:8px">${pos.length} POs shown (max 400)</div>`;
}

      <select onchange="ui.billF('job',this.value)"><option value="">All jobs</option>${S.jobs.map(x=>`<option value="${x.id}" ${f.job===x.id?'selected':''}>${esc(jn(x.name))}</option>`).join('')}</select>
      <select onchange="ui.billF('pay',this.value)"><option value="">Any status</option>

async function renderMaterials(){
  let usage={};
  try{
    const rows = await q(sb.from('v_material_usage').select('*'));
    rows.forEach(r=>{ usage[r.material_id]={n:Number(r.lines||0), t:Number(r.dollars||0)}; });
  }catch(e){ console.warn(e); }
  const f = S.matSearchTxt||'';
  const mats = S.mats.filter(m=>!f || m.name.toLowerCase().includes(f.toLowerCase()) || (m.family||'').toLowerCase().includes(f.toLowerCase()));
  const groups = {};
  mats.forEach(m=>{ (groups[m.category||'misc']=groups[m.category||'misc']||[]).push(m); });
  $('#app').innerHTML = `
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <input placeholder="Search materials…" value="${esc(f)}" oninput="ui.matSearch(this.value)" style="width:240px">
      <button class="btn primary" style="margin-left:auto" onclick="ui.newMaterial()">+ Material</button>
    </div>
    ${[...CATS.filter(c=>groups[c]),...Object.keys(groups).filter(c=>!CATS.includes(c))].map(cat=>`
      <div class="sect-title">${CATLABEL[cat]||esc(cat)} <span class="muted small">(${groups[cat].length})</span></div>
      <div class="card" style="padding:0;overflow-x:auto"><table class="tbl">
      <tbody>${groups[cat].map(m=>{
        const u=usage[m.id]||{n:0,t:0};
        return `<tr class="click" onclick="ui.openMaterial('${m.id}')">
          <td style="width:34%"><b>${esc(m.name)}</b> ${m.active===false?'<span class="chip gray">inactive</span>':''}</td>
          <td class="muted small">${esc(m.family&&m.family!==m.name?('family: '+m.family):'')}</td>
          <td class="small muted">${esc(m.uom)}</td>
          <td class="r small">${u.n} lines</td><td class="r">${money(u.t)}</td></tr>`;}).join('')}
      </tbody></table></div>`).join('')}`;
}

ui.mergeMaterial = async (srcId)=>{
  const dst = $('#em-merge').value;
  if(!dst || dst===srcId) return toast('Pick a different target material', true);
  const src = matById(srcId), d = matById(dst);
  if(!confirm(`Merge "${src.name}" into "${d.name}"? All lines, aliases and budgets move over, then "${src.name}" is deleted.`)) return;
  try{
    await sb.from('description_aliases').update({material_id:dst}).eq('material_id',srcId);
    await sb.from('po_line_items').update({material_id:dst}).eq('material_id',srcId);
    await sb.from('bill_line_items').update({material_id:dst}).eq('material_id',srcId);
    await sb.from('budgets').update({material_id:dst}).eq('material_id',srcId);
    await q(sb.from('materials').delete().eq('id',srcId).select());
    await audit('merge','materials',srcId,{into:dst, src:src.name, dst:d.name});
    closeModal(); toast('Merged'); S.jobCache={}; await loadCore(); renderMaterials();
  }catch(e){ fail(e); }
};
ui.deleteMaterial = async (id)=>{
  const m = matById(id);
  try{
    const {count} = await sb.from('po_line_items').select('*',{count:'exact',head:true}).eq('material_id',id);
    if(count>0) return toast(`${count} PO lines use this material — merge instead of deleting.`, true);
    if(!confirm(`Delete material "${m.name}"?`)) return;
    await sb.from('description_aliases').delete().eq('material_id',id);
    await sb.from('budgets').delete().eq('material_id',id);
    await q(sb.from('materials').delete().eq('id',id).select());
    await audit('delete','materials',id,{name:m.name});
    closeModal(); toast('Deleted'); await loadCore(); renderMaterials();
  }catch(e){ fail(e); }
};

ui.vendorType = async (id,t)=>{ try{ await q(sb.from('vendors').update({type:t}).eq('id',id).select()); await loadCore(); toast('Saved'); }catch(e){ fail(e); } };
ui.renameVendor = (id)=>{ const v=S.vendors.find(x=>x.id===id);
  promptRow('Vendor name', async nv=>{ try{ await q(sb.from('vendors').update({name:nv}).eq('id',id).select()); await loadCore(); renderVendors(); }catch(e){ fail(e); } });
  setTimeout(()=>{ if($('#pr-v')) $('#pr-v').value=v.name; },80); };
ui.deleteVendor = async (id)=>{
  const v=S.vendors.find(x=>x.id===id);
  try{
    const {count} = await sb.from('purchase_orders').select('*',{count:'exact',head:true}).eq('vendor_id',id);
    const {count:bc} = await sb.from('bills').select('*',{count:'exact',head:true}).eq('vendor_id',id);
    if((count||0)+(bc||0) > 0) return toast('Vendor has POs/bills — cannot delete.', true);
    if(!confirm(`Delete vendor "${v.name}"?`)) return;
    await q(sb.from('vendors').delete().eq('id',id).select());
    await audit('delete','vendors',id,{name:v.name}); await loadCore(); renderVendors();
  }catch(e){ fail(e); }
};

/* ============================== ACTIVITY & SETTINGS ============================== */
async function renderActivity(){
  let log=[];
  try{ log = await q(sb.from('app_audit').select('*').order('created_at',{ascending:false}).limit(120)); }catch(e){}
  const ingest = log.filter(l=>['qb_ingest','pdf_ingest'].includes(l.action)).slice(0,8);
  $('#app').innerHTML = `
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-bottom:20px">
      <div class="card">
        <b>Data pipelines</b>
        <table class="tbl" style="margin-top:8px"><tbody>
          <tr><td>PO intake</td><td class="small muted">QuickBooks email → PDF extractor → auto-organized</td><td><span class="chip green">Live</span></td></tr>
          <tr><td>Bills + payment status</td><td class="small muted">QuickBooks API → daily sync</td><td><span class="chip green">Daily</span></td></tr>
        </tbody></table>
        <div class="small muted" style="margin-top:8px">Recent ingest runs:</div>
        ${ingest.map(l=>`<div class="small" style="padding:3px 0">${new Date(l.created_at).toLocaleString()} — <b>${esc(l.action)}</b> ${esc(l.entity||'')} ${esc(JSON.stringify(l.detail||{}).slice(0,80))}</div>`).join('')||'<div class="small muted">none yet</div>'}
      </div>
      <div class="card">
        <b>Settings</b>
        <div class="frow" style="margin-top:10px;align-items:flex-end">
          <div class="field"><label>Passcode</label><input id="set-pass" value="${esc(S.settings?.passcode||'')}"></div>
          <button class="btn" onclick="ui.savePass()">Save</button>
        </div>
        <div class="frow" style="align-items:flex-end">
          <div class="field"><label>Company name</label><input id="set-co" value="${esc(S.settings?.company_name||'AA Drywall')}"></div>
          <button class="btn" onclick="ui.saveCo()">Save</button>
        </div>
        <div style="margin-top:10px"><button class="btn" onclick="ui.rematch()">↻ Re-run material matcher</button></div>
      </div>
    </div>
    <div class="sect-title">Audit log</div>
    <div class="card" style="padding:0;overflow-x:auto"><table class="tbl">
      <thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Entity</th><th>Detail</th></tr></thead>
      <tbody>${log.map(l=>`<tr><td class="small muted">${new Date(l.created_at).toLocaleString()}</td>
        <td class="small">${esc(l.actor||'—')}</td><td><b>${esc(l.action)}</b></td>
        <td class="small">${esc(l.entity||'')} ${esc(String(l.entity_id||'').slice(0,12))}</td>
        <td class="small muted">${esc(JSON.stringify(l.detail||{}).slice(0,90))}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No audit entries</td></tr>'}
      </tbody></table></div>`;
}
ui.savePass = async ()=>{
  const v = $('#set-pass').value.trim(); if(!v) return;
  try{ await q(sb.from('settings').update({passcode:v}).eq('id',1).select()); S.settings.passcode=v;
    localStorage.setItem('aadw_key', btoa('k:'+v)); await audit('update','settings','passcode',{}); toast('Passcode updated'); }catch(e){ fail(e); }
};
ui.saveCo = async ()=>{
  try{ await q(sb.from('settings').update({company_name:$('#set-co').value}).eq('id',1).select()); toast('Saved'); }catch(e){ fail(e); }
};

/* ============================== modal & palette ============================== */
let modalSave=null;
function openModal(title, body, onSave, wide, extraFoot){
  modalSave = onSave;
  $('#modal-root').innerHTML = `<div class="modal ${wide?'wide':''}">
    <div class="modal-h"><h3>${title}</h3><button class="modal-x" onclick="closeModal()">×</button></div>
    <div class="modal-b">${body}</div>
    <div class="modal-f">${extraFoot||''}<span style="flex:1"></span>
      <button class="btn" onclick="closeModal()">Close</button>
      ${onSave?'<button class="btn primary" onclick="ui._save()">Save</button>':''}</div>
  </div>`;
  $('#modal-root').classList.add('open');
}
ui._save = ()=>{ if(modalSave) modalSave(); };
window.closeModal = ()=>{ $('#modal-root').classList.remove('open'); $('#modal-root').innerHTML=''; modalSave=null; };
$('#modal-root').addEventListener('click', e=>{ if(e.target.id==='modal-root') closeModal(); });

/* command palette */
let palSel=0, palItems=[];
ui.openPal = ()=>{
  $('#pal').classList.add('open'); $('#pal-in').value=''; palRender(''); $('#pal-in').focus();
};
function palRender(qs){
  const ql = qs.toLowerCase();
  const items = [
    ...NAV.map(([r,ic,l])=>({k:'page',label:l,go:()=>location.hash='#/'+r})),
    ...S.jobs.map(j=>({k:'job',label:jn(j.name),go:()=>location.hash='#/job/'+j.id})),
    ...S.mats.map(m=>({k:'material',label:m.name,go:()=>{location.hash='#/materials'; setTimeout(()=>ui.openMaterial(m.id),200);}})),
  ].filter(x=>!ql || x.label.toLowerCase().includes(ql)).slice(0,12);
  palItems = items; palSel = 0;
  $('#pal-list').innerHTML = items.map((x,i)=>`<div class="pal-item ${i===0?'sel':''}" onclick="ui._palGo(${i})">
    <span class="k">${x.k}</span>${esc(x.label)}</div>`).join('');
}
ui._palGo = (i)=>{ $('#pal').classList.remove('open'); if(palItems[i]) palItems[i].go(); };
$('#pal-in').addEventListener('input', e=>palRender(e.target.value));
$('#pal-in').addEventListener('keydown', e=>{
  if(e.key==='Escape') $('#pal').classList.remove('open');
  if(e.key==='Enter'){ ui._palGo(palSel); }
  if(e.key==='ArrowDown'){ palSel=Math.min(palSel+1,palItems.length-1); updPalSel(); e.preventDefault(); }
  if(e.key==='ArrowUp'){ palSel=Math.max(palSel-1,0); updPalSel(); e.preventDefault(); }
});
function updPalSel(){ document.querySelectorAll('.pal-item').forEach((el,i)=>el.classList.toggle('sel',i===palSel)); }
$('#pal').addEventListener('click', e=>{ if(e.target.id==='pal') $('#pal').classList.remove('open'); });
document.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){ e.preventDefault(); ui.openPal(); }
  if(e.key==='Escape'){ closeModal(); $('#pal').classList.remove('open'); }
});

ui.refresh = async ()=>{ S.jobCache={}; await loadCore(); route(); toast('Refreshed'); };

boot();
</script>
