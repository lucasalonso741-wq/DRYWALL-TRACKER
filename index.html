<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AA Drywall Job Tracker</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="login" hidden>
  <form class="login-box" id="login-form" autocomplete="on">
    <div class="wordmark">AA DRYWALL</div>
    <div class="login-sub">Job Tracker</div>
    <label>Email</label>
    <input id="lg-email" type="email" autocomplete="username" required>
    <label>Password</label>
    <input id="lg-pass" type="password" autocomplete="current-password" required>
    <div class="login-err" id="lg-err"></div>
    <button class="btn primary big" type="submit" id="lg-btn">Sign in</button>
    <a class="link" id="lg-forgot" href="#">Forgot password</a>
  </form>
</div>

<div id="app" hidden>
  <header id="top">
    <a class="brand" href="#/jobs">AA DRYWALL</a>
    <nav id="nav"></nav>
    <div class="status" id="status"></div>
  </header>
  <main id="view"></main>
</div>

<div id="drawer-back" hidden></div>
<aside id="drawer" hidden>
  <div class="drawer-head"><h3 id="drawer-title"></h3><span id="save-state" class="save-state"></span><button class="x" onclick="closeDrawer()" aria-label="Close">&times;</button></div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<div id="modal-back" hidden><div id="modal" role="dialog"></div></div>
<button id="pending" hidden onclick="rerender(true)">New data came in. Tap to refresh.</button>
<div id="toasts"></div>

<script src="supabase.min.js"></script>
<script src="js/core.js"></script>
<script src="js/charts.js"></script>
<script src="js/jobs.js"></script>
<script src="js/job_tabs.js"></script>
<script src="js/lists.js"></script>
<script src="js/editors.js"></script>
<script src="js/setup.js"></script>
<script src="js/chat.js"></script>
<script>boot();</script>
</body>
</html>
